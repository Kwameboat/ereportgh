<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="application-name" content="Student Results" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Student Results" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <title>Payment — Student Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'system-ui', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif'],
          },
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/public-theme.css" />
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-900/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <a href="index.html" class="flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-teal-400 text-lg font-bold text-white shadow-lg shadow-brand-500/25">SR</span>
        <span class="font-display text-lg font-semibold tracking-tight text-white">Student Results</span>
      </a>
      <a href="index.html#check" class="rounded-full px-3 py-1.5 text-xs font-bold text-slate-200 hover:bg-white/10 hover:text-white sm:text-sm">Back to checker</a>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-4 pb-20 pt-16 sm:px-6">
    <div class="text-center">
      <p class="font-display text-2xl font-bold text-slate-900">Completing your payment</p>
      <p class="mt-3 text-base font-semibold text-slate-700">Please wait while we confirm with Paystack.</p>
    </div>
    <div id="out" class="hidden" role="status"></div>
  </main>

  <footer class="border-t border-slate-200 bg-white py-8 text-center text-sm text-slate-500">
    <a href="index.html" class="font-medium text-brand-600 hover:text-brand-700">← Home</a>
  </footer>

  <script defer src="/js/payment.js"></script>
  <script defer src="/js/pwa-register.js"></script>
</body>
</html>
